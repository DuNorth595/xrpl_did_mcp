[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xrpl-did-mcp"
version = "0.3.0"
description = "MCP server for did:xrpl -- W3C-compatible agent identity on the XRP Ledger"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "S_DevLabs", email = "S_DevLabs@outlook.com" }]
keywords = [
  "xrp-ledger", "xrpl", "did", "did-xrpl", "decentralized-identity",
  "ai-agents", "mcp", "model-context-protocol", "verifiable-credentials",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  # xrpl-agent-id is not on PyPI yet, so it is installed from GitHub.
  #
  # Pinned to a release tag, not to `main`. A direct reference cannot carry
  # a version specifier, so the tag IS the pin: without it, `pip install`
  # would resolve whatever `main` happened to be at that moment, and a
  # breaking change upstream would silently change an install that was
  # already working.
  "xrpl-agent-id @ git+https://github.com/DuNorth595/xrpl_agent_id.git@v0.5.2",
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/DuNorth595/xrpl_did_mcp"
Repository = "https://github.com/DuNorth595/xrpl_did_mcp"
Issues = "https://github.com/DuNorth595/xrpl_did_mcp/issues"

[project.scripts]
xrpl-did-mcp = "xrpl_did_mcp.server:main"

[tool.hatch.metadata]
# xrpl-agent-id is not on PyPI yet; it is a direct reference to GitHub.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/xrpl_did_mcp"]
# Ship the PEP 561 marker so mypy/pyright pick up the annotations.
artifacts = ["src/xrpl_did_mcp/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
